<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>إبراء · Ibraa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #13201C;
            color: #EEF3F0;
            font-family: "IBM Plex Sans Arabic", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Tajawal", "Cairo", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .logo-box {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: #0F6E5E;
            border: 1px solid #1a8571;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            animation: pulse 2s infinite;
        }
        .logo-box img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        h1 {
            font-size: 20px;
            font-weight: 900;
            color: #EEF3F0;
            margin-bottom: 6px;
        }
        p {
            font-size: 12px;
            color: #9DB3AA;
            margin-bottom: 24px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(76, 195, 168, 0.2);
            border-radius: 50%;
            border-top-color: #4CC3A8;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="logo-box">
        <img src="logo.png" alt="Ibraa" onerror="this.style.display='none'">
    </div>
    <h1>إبراء</h1>
    <p>جاري الاتصال بنظام الفواتير والمخزون السحابي...</p>
    <div class="spinner"></div>

    <script>
        // Automatic Gateway Redirect to Server / Tenant Domain
        const serverUrl = window.localStorage.getItem('sroor_server_url') || 'http://localhost:8000';
        setTimeout(() => {
            window.location.href = serverUrl;
        }, 500);
    </script>
</body>
</html>
