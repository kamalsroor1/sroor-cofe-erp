; LOCAL DEVELOPMENT ONLY. Mirrors scripts/ops/templates/php-sroor.ini.tmpl, except where dev
; needs the opposite: errors are shown and OPcache re-checks files on every request
; (production sets validate_timestamps=0 because code only changes through a release switch).
expose_php = Off
display_errors = On
display_startup_errors = On
log_errors = On
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 155M
post_max_size = 160M
date.timezone = UTC
session.cookie_httponly = 1
session.use_strict_mode = 1
realpath_cache_size = 4096K

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
