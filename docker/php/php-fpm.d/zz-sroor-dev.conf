; LOCAL DEVELOPMENT ONLY. Loaded after the image's www.conf / zz-docker.conf.
; FPM runs as the host-matching user (the image USER), so the `user`/`group` directives of
; www.conf are ignored (FPM logs a NOTICE about it; harmless).
[global]
daemonize = no

[www]
listen = 9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no
; Same as the VPS pool: workers see no container environment, only backend/.env.
clear_env = yes
