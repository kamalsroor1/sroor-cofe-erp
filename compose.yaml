# =====================================================================================
# Sroor / Ibraa ERP - LOCAL DEVELOPMENT STACK ONLY.
# Production stays native on the VPS (scripts/ops, docs/07-operations/vps-runbook.md);
# nothing here is used by CI, release.yml, deploy.yml or scripts/ops/deploy.sh.
#
# Start with docker/bin/dev.sh (docs/07-operations/local-docker.md):
#   docker/bin/dev.sh init      # once: backend/.env.docker + image build + APP_KEY
#   docker/bin/dev.sh up        # = docker compose up -d
#   docker/bin/dev.sh setup     # migrate (as the migrator) + grants + tenants:migrate + seed
#
# Every published port is bound to 127.0.0.1. Credentials live only in the git-ignored
# backend/.env.docker (random values generated by `dev.sh init`).
# Works with `docker compose` and `podman compose` (see the doc for rootless Podman).
# =====================================================================================

name: sroor-dev

x-php-service: &php-service
  image: sroor-dev-php:8.5.12
  build:
    context: ./docker/php
    args:
      SROOR_UID: ${SROOR_UID:-1000}
      SROOR_GID: ${SROOR_GID:-1000}
  environment:
    # Marker for docker/php/bin/sroor-dev-migrate. All Laravel settings come from
    # backend/.env.docker only: a real env var here would win over phpunit.xml's <env>.
    SROOR_DEV_CONTAINER: "1"
  volumes:
    - type: bind
      source: .
      target: /srv/sroor
      bind:
        selinux: z
    # backend/.env.docker replaces backend/.env inside the containers only.
    - type: bind
      source: ./backend/.env.docker
      target: /srv/sroor/backend/.env
      bind:
        create_host_path: false
        selinux: z
  working_dir: /srv/sroor/backend
  # Rootless Podman: `keep-id` maps the host user to the same UID inside the container
  # (dev.sh sets it when it runs `podman compose`). Empty = runtime default (Docker).
  userns_mode: ${SROOR_USERNS_MODE:-}
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # PHP-FPM 8.5 (the VPS runs PHP-FPM 8.5 behind nginx too).
  app:
    <<: *php-service
    command: ["php-fpm"]

  # nginx with the same routing rules as the VPS vhost (only index.php executes).
  web:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:${SROOR_HTTP_PORT:-8000}:80"
    volumes:
      - type: bind
        source: .
        target: /srv/sroor
        read_only: true
        bind:
          selinux: z
      - type: bind
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          selinux: z
    depends_on:
      - app
    restart: unless-stopped

  # Queue workers: Horizon on Redis, like supervisor-horizon.conf on the VPS.
  # Code changes need `docker compose restart horizon` (same as horizon:terminate on deploy).
  horizon:
    <<: *php-service
    command: ["php", "artisan", "horizon"]
    stop_signal: SIGTERM
    stop_grace_period: 30s

  # Scheduler: `schedule:work` = the VPS cron `schedule:run` every minute.
  scheduler:
    <<: *php-service
    command: ["php", "artisan", "schedule:work"]

  # Vite dev server with HMR on http://localhost:5173 (writes backend/public/hot while running).
  vite:
    <<: *php-service
    command:
      - bash
      - -c
      - '[ -x node_modules/.bin/vite ] || npm ci --ignore-scripts; exec node_modules/.bin/vite --host 0.0.0.0 --port 5173 --strictPort'
    ports:
      - "127.0.0.1:5173:5173"
    depends_on: []

  mysql:
    image: mysql:8.4.13-oraclelinux9
    # The root password is read from backend/.env.docker so it never sits in this file. The init
    # script runs as the `mysql` user, which cannot read the host-owned 0600 file: it gets a
    # private copy inside the container (/tmp/sroor-env).
    entrypoint:
      - bash
      - -c
      - 'MYSQL_ROOT_PASSWORD="$$(grep -E "^SROOR_DEV_MYSQL_ROOT_PASSWORD=" /sroor/env | tail -n 1 | cut -d= -f2-)"; [ -n "$$MYSQL_ROOT_PASSWORD" ] || { echo "SROOR_DEV_MYSQL_ROOT_PASSWORD is empty in backend/.env.docker (run docker/bin/dev.sh init)" >&2; exit 1; }; export MYSQL_ROOT_PASSWORD; install -o mysql -g mysql -m 600 /sroor/env /tmp/sroor-env; exec docker-entrypoint.sh mysqld'
    ports:
      - "127.0.0.1:${SROOR_MYSQL_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./docker/mysql/conf.d
        target: /etc/mysql/conf.d
        read_only: true
        bind:
          selinux: z
      - type: bind
        source: ./docker/mysql/init
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          selinux: z
      # Same grants library as the VPS provisioning (single source of truth).
      - type: bind
        source: ./scripts/ops/lib
        target: /sroor/ops-lib
        read_only: true
        bind:
          selinux: z
      - type: bind
        source: ./backend/.env.docker
        target: /sroor/env
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:8.4.8-alpine
    # requirepass from backend/.env.docker, written to a config file (not argv); same
    # noeviction/appendonly policy as redis-sroor.conf.tmpl on the VPS.
    command:
      - sh
      - -c
      - 'umask 077; printf "requirepass %s\nappendonly yes\nappendfsync everysec\nmaxmemory 256mb\nmaxmemory-policy noeviction\n" "$$(grep -E "^REDIS_PASSWORD=" /sroor/env | tail -n 1 | cut -d= -f2-)" > /tmp/sroor-redis.conf; exec redis-server /tmp/sroor-redis.conf'
    ports:
      - "127.0.0.1:${SROOR_REDIS_PORT:-63790}:6379"
    volumes:
      - redis-data:/data
      - type: bind
        source: ./backend/.env.docker
        target: /sroor/env
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$(grep -E "^REDIS_PASSWORD=" /sroor/env | tail -n 1 | cut -d= -f2-)" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
