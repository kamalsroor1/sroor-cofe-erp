<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>إبراء · Ibraa POS</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                user-select: none;
                -webkit-user-select: none;
                -webkit-app-region: drag;
            }

            body {
                font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, 'Cairo', 'Tajawal', sans-serif;
                background: transparent;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .splash-card {
                width: 480px;
                height: 320px;
                background: linear-gradient(135deg, #172822 0%, #13201c 100%);
                border: 1px solid rgba(76, 195, 168, 0.3);
                border-radius: 28px;
                box-shadow:
                    0 25px 50px -12px rgba(0, 0, 0, 0.85),
                    0 0 35px rgba(76, 195, 168, 0.12);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-between;
                padding: 30px 26px;
                position: relative;
                overflow: hidden;
            }

            /* Ambient Glow Backgrounds */
            .glow-1 {
                position: absolute;
                top: -40px;
                right: -40px;
                width: 160px;
                height: 160px;
                background: radial-gradient(circle, rgba(76, 195, 168, 0.18) 0%, transparent 70%);
                border-radius: 50%;
                pointer-events: none;
            }

            .glow-2 {
                position: absolute;
                bottom: -50px;
                left: -50px;
                width: 180px;
                height: 180px;
                background: radial-gradient(circle, rgba(15, 110, 94, 0.25) 0%, transparent 70%);
                border-radius: 50%;
                pointer-events: none;
            }

            /* Logo & Brand */
            .brand-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                margin-top: 10px;
            }

            /* Ibraa mark «الدايرة المقفولة»: draws once (~2.3s) and stays on the last frame. */
            .brand-mark {
                width: 72px;
                height: 72px;
                overflow: visible;
            }

            .brand-mark .m-all {
                transform-box: view-box;
                transform-origin: 50px 50px;
                animation: m-settle 0.45s ease-out 1.85s both;
            }

            .brand-mark .m-arc,
            .brand-mark .m-check {
                stroke-dasharray: 100;
            }

            .brand-mark .m-arc {
                animation: m-draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) both;
            }

            .brand-mark .m-head {
                transform-box: fill-box;
                transform-origin: center;
                animation: m-pop 0.25s ease-out 1.05s both;
            }

            .brand-mark .m-check {
                animation: m-draw 0.45s ease-out 1.35s both;
            }

            @keyframes m-draw {
                from {
                    stroke-dashoffset: 100;
                }
                to {
                    stroke-dashoffset: 0;
                }
            }

            @keyframes m-pop {
                0% {
                    opacity: 0;
                    transform: scale(0.4);
                }
                60% {
                    opacity: 1;
                    transform: scale(1.2);
                }
                100% {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            @keyframes m-settle {
                0%,
                100% {
                    transform: scale(1);
                }
                45% {
                    transform: scale(1.07);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .brand-mark * {
                    animation: none !important;
                }
            }

            .app-title {
                color: #eef3f0;
                font-family: 'Reem Kufi', 'IBM Plex Sans Arabic', sans-serif;
                font-size: 26px;
                font-weight: 700;
                text-align: center;
            }

            .app-subtitle {
                color: #9db3aa;
                font-size: 11px;
                font-weight: 600;
                text-align: center;
                margin-top: -2px;
            }

            /* Loading Bar Section */
            .loading-section {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 8px;
                margin-bottom: 6px;
            }

            .loading-status {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 11px;
                color: #64748b;
                font-weight: 700;
                padding: 0 4px;
            }

            .status-text {
                color: #4cc3a8;
            }

            .progress-track {
                width: 100%;
                height: 6px;
                background: #22362f;
                border-radius: 999px;
                overflow: hidden;
                position: relative;
            }

            .progress-fill {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                width: 40%;
                background: linear-gradient(90deg, #0f6e5e 0%, #4cc3a8 100%);
                border-radius: 999px;
                animation: indeterminate 1.8s infinite cubic-bezier(0.65, 0, 0.35, 1);
            }

            @keyframes indeterminate {
                0% {
                    left: -40%;
                    width: 40%;
                }
                50% {
                    left: 30%;
                    width: 50%;
                }
                100% {
                    left: 100%;
                    width: 40%;
                }
            }

            /* Footer Version */
            .splash-footer {
                display: flex;
                justify-content: space-between;
                width: 100%;
                align-items: center;
                font-size: 10px;
                color: #475569;
                font-weight: bold;
                font-family: monospace;
            }

            .badge-enterprise {
                background: rgba(76, 195, 168, 0.12);
                color: #4cc3a8;
                padding: 2px 8px;
                border-radius: 6px;
                border: 1px solid rgba(76, 195, 168, 0.25);
                font-size: 9px;
            }
        </style>
    </head>
    <body>
        <div class="splash-card">
            <div class="glow-1"></div>
            <div class="glow-2"></div>

            <div class="brand-container">
                <svg class="brand-mark" viewBox="0 0 100 100" role="img" aria-label="Ibraa">
                    <g class="m-all" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            class="m-arc"
                            pathLength="100"
                            d="M50 14 A36 36 0 1 1 20 30"
                            stroke="#4cc3a8"
                            stroke-width="9"
                        />
                        <polyline class="m-head" points="12,22 20,30 30,24" stroke="#4cc3a8" stroke-width="7" />
                        <polyline
                            class="m-check"
                            pathLength="100"
                            points="36,51 46,61 66,40"
                            stroke="#eef3f0"
                            stroke-width="7"
                        />
                    </g>
                </svg>
                <div>
                    <h1 class="app-title">إبراء</h1>
                    <p class="app-subtitle">نظام الفواتير ونقاط البيع السحابية متعدد الفروع</p>
                </div>
            </div>

            <div class="loading-section">
                <div class="loading-status">
                    <span class="status-text" id="statusLabel">جاري تهيئة النظام والمحرك...</span>
                    <span>Ibraa POS</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
            </div>

            <div class="splash-footer">
                <span>© Baraa Solutions 2026</span>
                <span class="badge-enterprise">Enterprise Edition v1.0</span>
            </div>
        </div>

        <script>
            const statuses = [
                'جاري تهيئة محرك الديسك توب...',
                'التحقق من الاتصال بالخادم المركزي...',
                'مزامنة الأجهزة وطابعات الكاشير...',
                'بدء تشغيل نقطة البيع السريعة...',
            ];
            let idx = 0;
            setInterval(() => {
                idx = (idx + 1) % statuses.length;
                const el = document.getElementById('statusLabel');
                if (el) el.textContent = statuses[idx];
            }, 750);
        </script>
    </body>
</html>
